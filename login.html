<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="background-image">
    <center>
        <div class="login_center_section">

            <div class="login_tag">
                <h1>Welcome back to Modern Nest</h1>
            </div>
            <div class="login_tag_head">
                <h5>Please Enter Your Information Below</h5>
            </div>

            <div class="login_form_container">

                <div class="text_group">
                    <label for="username">Email*</label><br>
                    <input type="text" id="username" name="username">
                </div>

                <div class="text_group_1">
                    <label for="password">Password*</label><br>
                    <input type="password" id="password" name="password">
                </div>

                <div class="forgot_password">
                    forgot password
                </div>

                <div class="remember_me">
                    <input type="checkbox" id="remember" name="remember" value="1">
                    <label for="remember">Remember me</label>
                </div>

                <div class="form_submit">
                    <input type="submit" value="login">
                </div>
                <span class="login-link_text">Don't have account? <a href="signup.html"><br><b>signup</b></br></a></span>
            </div>
        </div>
    </center>

</body>

</html>
