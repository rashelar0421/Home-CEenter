<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - The Modern Nest</title>
    <link rel="stylesheet" href="css/signup.css">
</head>

<body class="signup-bg">

    
    <div class="signup_form_container">

        <div class="signup_tag">
            <h1>Create Your Account</h1>
        </div>
        <div class="signup_tag_head">
            <h5>Join The Modern Nest community today</h5>
        </div>

        <form action="#" method="POST">
            
            <div class="text_group">
                <label for="fullname">Full Name*</label><br>
                <input type="text" id="fullname" name="fullname" required placeholder="Enter your full name">
            </div>
            <div class="text_group">
                <label for="email">Email Address*</label><br>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>
            <div class="text_group">
                <label for="password">Create Password*</label><br>
                <input type="password" id="password" name="password" required placeholder="Minimum 8 characters">
            </div> 
            <div class="remember_me">
                <input type="checkbox" id="terms" name="terms" value="1" required>
                <label for="terms">I agree to the Terms & Conditions</label>
            </div>
            <div class="form_submit">
                <input type="submit" value="Sign Up">
            </div>

        </form>
        <span class="login-link">Already have an Account? <a href="login.html"><br><b>LOGIN</b></br></a></span>
    </div>

</body>

</html>
